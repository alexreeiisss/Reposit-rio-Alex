<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de média</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Calcular média aluno</h1>
    <p>Digite as notas do aluno</p>

    <div class="formulario">
        <input type="number" id="nota1" min="0" max="10" placeholder="Primeira nota">
        <input type="number" id="nota2" min="0" max="10" placeholder="Segunda nota">

        <button onclick="calcularMedia()">Calcular média</button>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
